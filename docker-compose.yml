services:
  foodsense:
    build:
      context: .
      dockerfile: Dockerfile
    image: foodsense:latest
    container_name: foodsense
    ports:
      - "8000:8000"
    environment:
      # All optional — the pipeline runs fully offline without any of these.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
