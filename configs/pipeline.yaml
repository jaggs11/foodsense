# Pipeline-wide settings: objective weights, optimiser hyperparameters,
# tolerances and the random seed. Nothing here is a nutrition threshold -- those
# live in configs/age_groups/ and configs/goals/ with their sources attached.

seed: 42

# --------------------------------------------------------------------------
# Rule engine
# --------------------------------------------------------------------------
rule_engine:
  # Relative width of the sigmoid used to soften every threshold, as a fraction
  # of the threshold itself. At the threshold a rule scores exactly 0.5; at
  # 1 +/- 2*softness it is close to saturated. This is what makes the guideline
  # score differentiable enough for a surrogate to learn and an optimiser to
  # climb -- a hard step function gives neither of them anything to follow.
  softness: 0.15

  # Each hard-safety violation multiplies the score by this. One violation drops
  # a meal from 0.9 to 0.09; two put it at 0.009. "Multiply toward zero" rather
  # than "set to zero" keeps the surface informative: a meal with one hazard is
  # genuinely better than a meal with three, and the optimiser needs to see that.
  hard_violation_factor: 0.10

  # A soft rule scoring below this is recorded as a violation in the report.
  # 0.5 is exactly the threshold, so this flags any rule actually crossed.
  soft_violation_threshold: 0.5

# --------------------------------------------------------------------------
# Stage 1: suitability surrogate
# --------------------------------------------------------------------------
stage1:
  # Gaussian noise added to weak-supervision labels. Stops the surrogate from
  # memorising the exact rule boundaries and forces it to learn a smooth
  # approximation -- which is the entire reason it exists.
  label_noise_sigma: 0.05

  # What Stage 2 optimises toward, and the "meets target" line for evaluation.
  #
  # Calibrated against measurement rather than picked: across 500 Food.com meals
  # crossed with sampled profiles, unoptimised meals score a median of 0.43 and a
  # 90th percentile of 0.60, while deliberately well-constructed meals reach
  # 0.52-0.80 depending on how tightly the profile is constrained. 0.70 therefore
  # sits above almost every unedited meal and inside what a good edit can reach --
  # a bar the optimiser has to work for but can actually clear.
  target_score: 0.70

  # Thresholds at which the thresholded "meets target" AUC is reported. More than
  # one, because at the target itself the positive class is small; the lower
  # thresholds show whether the model ranks meals correctly across the range.
  auc_thresholds: [0.45, 0.55, 0.70]

  n_train_meals: 8000
  n_profiles_per_meal: 3
  perturbation_rate: 0.5
  test_size: 0.2

  lightgbm:
    n_estimators: 600
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 20
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.9
    reg_lambda: 1.0
  xgboost:
    n_estimators: 600
    learning_rate: 0.05
    max_depth: 7
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 1.0

# --------------------------------------------------------------------------
# Stage 2: counterfactual optimiser
# --------------------------------------------------------------------------
stage2:
  # Objective weights from the design brief:
  #   lambda1 * max(0, target - f(x))        validity pressure
  # + lambda2 * L1(x, x0) / scale            stay close to the planned meal
  # + lambda3 * (items changed) / n          change as few things as possible
  # + big_penalty * hard safety violations
  #
  # lambda_validity departs from the design brief's 1.0, on measured evidence.
  # The validity term is bounded by the target (0.70) because f is in [0,1], while
  # sparsity costs 0.15 per edit, so at 1.0 the optimiser cannot afford the edits
  # a meal needs: over 24 sampled cases it made 0.58 edits and improved the
  # guideline score by +0.019, i.e. it repaired safety and then stopped.
  # Measured sweep (24 cases, 8 per age group):
  #
  #   lambda1   soft after   delta    valid%   edits   L1 g   safe%
  #      1.0        0.474   +0.019      12%    0.58     22    100%
  #      2.0        0.495   +0.041      17%    0.71     30    100%
  #      3.0        0.536   +0.081      25%    0.96     43    100%
  #      5.0        0.617   +0.162      42%    1.42     59    100%
  #      8.0        0.675   +0.221      58%    2.21     98    100%
  #
  # 5.0 is chosen as the smallest weight that materially improves the meal while
  # keeping the mean edit count well inside the two-edit scale of the proposal's
  # own worked example. Note safety is 100% at every setting: that guarantee is
  # structural, not a consequence of tuning.
  lambda_validity: 5.0
  lambda_distance: 0.4
  lambda_sparsity: 0.15
  big_penalty: 1000.0

  # Grams by which the L1 distance is normalised, so the distance term is
  # comparable across meals of different sizes.
  distance_scale_g: 200.0

  # A quantity moved by less than this is not counted as a change; without it,
  # floating-point noise reads as an edit.
  quantity_epsilon_g: 2.0

  # Smallest amount that counts as being in the meal at all -- a separate idea
  # from the epsilon above. Without a floor the optimiser finds that a two-gram
  # sliver of lentils nudges the fibre score at almost no distance cost, and
  # returns a meal with three garnish-sized additions nobody would serve.
  min_serving_g: 10.0

  # Preference for the config's declared nearest-safe-form when a hazard has to
  # be repaired. Small on purpose: it decides between forms the rules consider
  # equally safe, and never outweighs safety, validity or distance. Without it
  # the optimiser repairs whole grapes by pureeing them, which is safe but is not
  # what the AAP's map says to do.
  lambda_form_preference: 0.05

  # Differential evolution, per the design brief.
  population_size: 40
  max_generations: 200
  mutation: [0.5, 1.0]
  recombination: 0.7
  # Stop once the meal is valid by the rule engine and the objective has stopped
  # improving for this many generations.
  early_stop_patience: 15
  early_stop_tolerance: 1.0e-4

  # Upper bound on any single item, and on how far an existing item may grow
  # relative to its planned amount.
  max_item_quantity_g: 400.0
  max_growth_factor: 2.5

# --------------------------------------------------------------------------
# Stages 3 and 4
# --------------------------------------------------------------------------
stage3:
  provider: template
  temperature: 0.2
  max_retries: 1
  retrieval_top_k: 5
  anthropic_model: claude-sonnet-4-6
  openai_model: gpt-4o-mini
  ollama_model: llama3.1

stage4:
  # Fuzzy name match at or above this is accepted; below it the item is flagged
  # unmatched and replaced by the retriever's top candidate.
  match_threshold: 85.0
  # A claimed nutrient or quantity beyond this relative gap from the database
  # value is corrected to the database value.
  nutrient_tolerance: 0.10
